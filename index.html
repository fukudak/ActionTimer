<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <title>吉日タイマー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div>
        <h1>吉日タイマー</h1>
        <p class="tagline">思い立ったが吉日 — 72時間で導火線は燃え尽きる</p>
      </div>
      <button type="button" class="icon-btn" id="history-toggle" aria-label="履歴を見る">
        <svg id="history-toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </button>
    </div>
  </header>
  <main>
    <p id="ui-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <p id="save-error" class="save-error" role="alert" aria-live="assertive" hidden></p>
    <div id="view-now" class="view view--active">
      <form id="add-form" class="add-form" autocomplete="off">
        <label for="add-input" class="sr-only">72時間以内に始めること</label>
        <input id="add-input" type="text" maxlength="100" placeholder="思い立ったことを書く" autocomplete="off" required>
        <button type="submit" class="btn-ignite">点火</button>
      </form>
      <section class="list-section" aria-labelledby="burning-heading">
        <h2 id="burning-heading" tabindex="-1">燃えている</h2>
        <ul id="burning-list" class="card-list"></ul>
        <p id="burning-empty" class="empty-note" hidden>まだ火はありません。思い立ったことを記すと、72時間の導火線が動き始めます。</p>
      </section>
      <section id="unexploded-section" class="list-section list-section--unexploded" aria-labelledby="unexploded-heading">
        <h2 id="unexploded-heading" tabindex="-1">燃え尽きた</h2>
        <ul id="unexploded-list" class="card-list"></ul>
        <p id="unexploded-empty" class="empty-note" hidden>燃え尽きた項目はありません。着手できなかった項目はここに残ります。</p>
      </section>
    </div>
    <div id="view-history" class="view">
      <section id="history-section" class="list-section list-section--history" aria-labelledby="history-heading">
        <div class="history-header-row">
          <h2 id="history-heading" tabindex="-1">履歴</h2>
        </div>
        <div id="history-summary" class="history-summary" hidden></div>
        <button type="button" class="btn-clear-history" id="history-clear" hidden>履歴をクリア</button>
        <ul id="history-list" class="card-list"></ul>
        <p id="history-empty" class="empty-note" hidden>まだ着手した履歴はありません。</p>
      </section>
    </div>
  </main>
  <p class="app-version">ver.1.0.0</p>
  <script src="app.js"></script>
</body>
</html>
