<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吉日タイマー — Liquid Glass 案</title>
<style>
  :root {
    color-scheme: dark light;
    --tint: #ff7a3d;
    --tint-strong: #ff4d2e;
    --bg: #0b0a09;
    --bg-elevated: #171310;
    --label: #f5efe8;
    --secondary-label: #b7a99b;
    --stroke: rgba(255,255,255,0.10);
    --glass-fill: rgba(255,255,255,0.06);
    --glass-fill-strong: rgba(255,255,255,0.09);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4efe9;
      --bg-elevated: #ffffff;
      --label: #241a12;
      --secondary-label: #6b5c4f;
      --stroke: rgba(0,0,0,0.08);
      --glass-fill: rgba(255,255,255,0.55);
      --glass-fill-strong: rgba(255,255,255,0.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "SF Pro Text", "Hiragino Sans", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--tint) 18%, transparent), transparent 55%),
      var(--bg);
    color: var(--label);
    max-width: 480px;
    margin-inline: auto;
    padding-bottom: 32px;
    min-height: 100vh;
  }
  .navbar {
    position: sticky; top: 0; z-index: 10;
    padding: 18px 20px 14px;
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    border-bottom: 1px solid var(--stroke);
  }
  .navbar h1 { font-size: 1.7rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .navbar p { font-size: 0.78rem; color: var(--secondary-label); margin: 4px 0 0; }

  .content { padding: 18px 20px 0; }

  .field { margin: 4px 0 12px; }
  .field label { display: block; font-size: 0.8rem; margin-bottom: 8px; color: var(--secondary-label); }
  .glass-input {
    display: flex;
    align-items: center;
    border-radius: 18px;
    background: var(--glass-fill);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--stroke);
    padding: 4px;
  }
  .glass-input input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--label);
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
  }
  .glass-input input::placeholder { color: var(--secondary-label); }

  .btn-prominent {
    width: 100%;
    min-height: 48px;
    margin: 4px 0 26px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--tint), var(--tint-strong));
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 6px 20px -6px color-mix(in srgb, var(--tint-strong) 60%, transparent);
    position: relative;
    overflow: hidden;
  }
  .btn-prominent::before {
    /* specular highlight */
    content: "";
    position: absolute; top: 0; left: -20%; right: -20%; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
    pointer-events: none;
  }
  .btn-prominent:active { transform: scale(0.98); }

  h2.section-title { font-size: 1.1rem; font-weight: 700; margin: 20px 0 12px; }

  .glass-row {
    position: relative;
    border-radius: 22px;
    background: var(--glass-fill);
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid var(--stroke);
    padding: 16px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .glass-row::before {
    /* specular highlight along top edge */
    content: "";
    position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  }
  .glass-row.urgent {
    background: color-mix(in srgb, var(--tint-strong) 16%, var(--glass-fill-strong));
    border-color: color-mix(in srgb, var(--tint-strong) 40%, var(--stroke));
  }

  .row-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 10px; }

  .burn-meter { height: 5px; border-radius: 3px; background: rgba(128,128,128,0.25); overflow: hidden; margin-bottom: 10px; }
  .burn-meter > span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffd54a, var(--tint)); box-shadow: 0 0 8px var(--tint); }
  .glass-row.urgent .burn-meter > span { background: linear-gradient(90deg, var(--tint), var(--tint-strong)); box-shadow: 0 0 10px var(--tint-strong); }

  .row-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .remaining { font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 600; color: var(--secondary-label); }
  .glass-row.urgent .remaining { color: var(--tint-strong); }

  .btn-bordered {
    min-height: 40px;
    padding: 8px 18px;
    border: 1px solid var(--stroke);
    border-radius: 14px;
    background: var(--glass-fill-strong);
    color: var(--label);
    font: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .glass-row.unexploded {
    background: color-mix(in srgb, var(--bg-elevated) 40%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0.9;
  }
  .unexploded-row-actions { display: flex; gap: 8px; }
  .btn-plain {
    min-height: 40px;
    padding: 8px 14px;
    border: none;
    background: transparent;
    color: var(--tint);
    font: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn-destructive {
    min-height: 40px;
    padding: 8px 14px;
    border: none;
    background: transparent;
    color: #ff6b52;
    font: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="navbar">
    <h1>吉日タイマー</h1>
    <p>思い立ったが吉日 — 72時間で導火線は燃え尽きる</p>
  </div>

  <div class="content">
    <div class="field">
      <label for="lg-input">72時間以内に始めること</label>
      <div class="glass-input">
        <input id="lg-input" type="text" placeholder="思い立ったことを書く" />
      </div>
    </div>
    <button class="btn-prominent">点火する</button>

    <h2 class="section-title">燃えている</h2>

    <div class="glass-row">
      <p class="row-title">資料のドラフトを書き始める</p>
      <div class="burn-meter"><span style="width:62%"></span></div>
      <div class="row-footer">
        <span class="remaining">残り 27時間14分</span>
        <button class="btn-bordered">着手した</button>
      </div>
    </div>

    <div class="glass-row urgent">
      <p class="row-title">歯医者に電話する</p>
      <div class="burn-meter"><span style="width:92%"></span></div>
      <div class="row-footer">
        <span class="remaining">残り 1時間48分</span>
        <button class="btn-bordered">着手した</button>
      </div>
    </div>

    <h2 class="section-title">不発弾</h2>

    <div class="glass-row unexploded">
      <p class="row-title" style="color: var(--secondary-label);">灰 本棚を整理する</p>
      <div class="row-footer">
        <span class="remaining">不発弾</span>
        <div class="unexploded-row-actions">
          <button class="btn-plain">再点火</button>
          <button class="btn-destructive">削除</button>
        </div>
      </div>
    </div>
  </div>
  <!-- ※ Web での近似実装(backdrop-filter + 半透明色で Liquid Glass の質感を近似)。公式実装は SwiftUI の Material API 群を参照 -->
</body>
</html>
