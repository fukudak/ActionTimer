<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吉日タイマー — 明色一行燃焼案(和風深化 方向C)</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7edd8;
    --bg-elevated: #fffaf0;
    --ink: #2c1c10;
    --ink-dim: #8a6f52;
    --row-edge: #e3d3ab;
    --flame-1: #ffcf3f;
    --flame-2: #ff7a1a;
    --flame-3: #ff3d1f;
    --char: #2a1f16;
    --danger: #d8360f;
    --ash: #a5906f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    max-width: 480px;
    margin-inline: auto;
    padding-bottom: 32px;
  }

  .header { padding: 26px 20px 16px; border-bottom: 1px solid var(--row-edge); }
  .header h1 {
    font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
    font-size: 1.7rem; letter-spacing: 0.16em; margin: 0; font-weight: 600; color: var(--ink);
  }
  .header p { font-size: 0.78rem; color: var(--ink-dim); margin: 6px 0 0; letter-spacing: 0.03em; }

  .content { padding: 0 20px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ラベルは非表示(sr-only)。入力欄と点火ボタンを1行にまとめる */
  .field-row { display: flex; gap: 8px; margin: 20px 0 28px; }
  .field-row input {
    flex: 1; min-width: 0; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--row-edge); background: var(--bg-elevated); color: var(--ink);
    font-size: 1rem; font-family: inherit;
  }
  .field-row input::placeholder { color: var(--ink-dim); }
  .field-row input:focus-visible { outline: 2px solid var(--flame-2); outline-offset: 2px; }

  .btn-ignite {
    flex-shrink: 0; padding: 0 20px; min-height: 48px; border: none; border-radius: 10px;
    background: var(--flame-2);
    color: #2a1200; font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap;
    box-shadow: 0 6px 18px -6px rgba(255,122,26,0.55);
  }
  .btn-ignite:active { transform: scale(0.98); }

  h2.section-title {
    font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
    font-size: 1rem; font-weight: 600; margin: 22px 0 10px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px;
  }
  h2.section-title::before { content: ""; width: 2px; height: 1.1em; background: var(--flame-2); }

  /* ===== 横スライドで編集・削除を出す ===== */
  .swipe-cell {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  /* 幅はボタン分だけ(=144px)。inset:0 にするとセル全幅になり開閉判定がずれるため right 固定で幅を内容に委ねる */
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 0;
    display: flex; align-items: stretch;
  }
  .swipe-btn {
    width: 72px; border: none; font: inherit; font-weight: 700; font-size: 0.82rem;
    color: #fff9ef; cursor: pointer;
  }
  .swipe-edit { background: #8a6f52; }
  .swipe-delete { background: var(--danger); }
  .swipe-content {
    position: relative; z-index: 1;
    touch-action: pan-y;
    transition: transform 0.25s ease;
    background: var(--bg-elevated);
    user-select: none; -webkit-user-select: none;
  }
  .swipe-content.dragging { transition: none; }

  /* ===== 燃焼タスク行: 1行目=ノート+ボタン、2行目=残り時間 ===== */
  .fuse-row {
    position: relative;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 8px 10px 8px 0;
    border-radius: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--row-edge);
  }
  /* 燃えるノート: タイトル部分だけを焦がす。残り時間・ボタンは常に紙面上にあり可読性を保つ */
  .fuse-note {
    --burn: 62%;
    position: relative;
    flex: 1; min-width: 0;
    height: 46px;
    border-radius: 8px;
    overflow: hidden;
    /* 燃えていない側(残り時間)=ポップな配色を地の色として敷く */
    background: linear-gradient(100deg, #ffcf3f, #ff9d3d 55%, #ff7a3d);
  }
  /* 燃え尽きた側(右)を焦がす。--burn(経過割合)が大きいほど右側の黒い領域が左へ広がる */
  .fuse-note::before {
    content: "";
    position: absolute; inset: 0 0 0 calc(100% - var(--burn));
    background: linear-gradient(90deg, var(--char), #17110b 85%);
    clip-path: polygon(100% 0, 4px 0, 0 18%, 5px 34%, 0 50%, 4px 66%, 0 82%, 3px 100%, 100% 100%);
  }
  /* 燃えている最前線(発光)。境界は右端から --burn ぶん進んだ位置 */
  .fuse-note::after {
    content: "";
    position: absolute; top: -4px; bottom: -4px; left: calc(100% - var(--burn)); width: 20px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--flame-2), #fff6b0, var(--flame-1), transparent);
    filter: blur(4px);
  }
  /* タイトルは常に左揃え・左端固定。残量(--burn)が変わっても文字の開始位置は動かさない */
  .fuse-title {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 14px;
    color: #fff9ef;
    text-shadow:
      -1px -1px 1px rgba(0,0,0,.55), 1px -1px 1px rgba(0,0,0,.55),
      -1px 1px 1px rgba(0,0,0,.55), 1px 1px 1px rgba(0,0,0,.55),
      0 2px 5px rgba(0,0,0,.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.98rem; font-weight: 700;
  }

  /* 2行目のキャプション。ボタンの有無や文字数に関わらず note の右端(=焦げの右端)には影響しない */
  .fuse-remaining {
    flex-basis: 100%;
    order: 3;
    padding-left: 14px;
    font-variant-numeric: tabular-nums; font-size: 0.78rem; font-weight: 700;
    color: var(--ink-dim); white-space: nowrap;
  }
  .fuse-row.urgent .fuse-remaining { color: var(--danger); }

  .fuse-action {
    min-height: 36px; padding: 6px 14px; border: 1px solid var(--flame-2); border-radius: 20px;
    background: var(--bg-elevated); color: var(--flame-3); font: inherit; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .fuse-row.urgent .fuse-action { border-color: var(--danger); color: var(--danger); }

  .fuse-row.urgent {
    border-color: var(--danger);
    animation: fuse-pulse 1.8s ease-in-out infinite;
  }
  @keyframes fuse-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(216,54,15,0); }
    50% { box-shadow: 0 0 14px 1px rgba(216,54,15,0.35); }
  }

  /* ===== 不発弾: 一行、灰色で静止(燃焼帯なし) ===== */
  .fuse-row.spent {
    background: #efe4c9;
    border-color: var(--row-edge);
    padding-left: 14px;
  }
  .spent-title {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.98rem; font-weight: 600;
    color: var(--ash);
  }
  .spent-title::before { content: "灰 "; font-size: .82em; }
  .btn-reignite {
    min-height: 34px; padding: 5px 12px; border: 1px solid var(--ash); border-radius: 16px;
    background: transparent; color: var(--ash); font: inherit; font-size: 0.76rem; cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>吉日タイマー</h1>
    <p>思い立ったが吉日 — 72時間で導火線は燃え尽きる</p>
  </div>

  <div class="content">
    <div class="field-row">
      <label class="sr-only" for="bright-input">72時間以内に始めること</label>
      <input id="bright-input" type="text" placeholder="思い立ったことを書く" />
      <button class="btn-ignite">点火</button>
    </div>

    <h2 class="section-title">思い立った</h2>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row">
          <div class="fuse-note" style="--burn: 18%">
            <span class="fuse-title">資料のドラフトを書き始める</span>
          </div>
          <span class="fuse-remaining">残り 62時間</span>
          <button class="fuse-action">着手</button>
        </div>
      </div>
    </div>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row">
          <div class="fuse-note" style="--burn: 62%">
            <span class="fuse-title">実家に電話する</span>
          </div>
          <span class="fuse-remaining">残り 27時間14分</span>
          <button class="fuse-action">着手</button>
        </div>
      </div>
    </div>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row urgent">
          <div class="fuse-note" style="--burn: 92%">
            <span class="fuse-title">歯医者に電話する</span>
          </div>
          <span class="fuse-remaining">残り 1時間48分</span>
          <button class="fuse-action">着手</button>
        </div>
      </div>
    </div>

    <h2 class="section-title">不発弾</h2>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row spent">
          <span class="spent-title">本棚を整理する</span>
          <button class="btn-reignite">再点火</button>
        </div>
      </div>
    </div>
  </div>
  <!-- ※ 一行=1タスクの燃焼演出(明色パレット)。汎用デザインシステムへの準拠は意図していない -->
  <script>
    // 横スライドで編集・削除を出す(ポインターイベントでマウス/タッチ両対応)
    document.querySelectorAll(".swipe-cell").forEach((cell) => {
      const content = cell.querySelector(".swipe-content");
      const actions = cell.querySelector(".swipe-actions");
      let startX = 0;
      let originX = 0;
      let currentX = 0;
      let dragging = false;

      function openWidth() {
        return actions.getBoundingClientRect().width;
      }

      function setX(x, animate) {
        content.classList.toggle("dragging", !animate);
        content.style.transform = `translateX(${x}px)`;
        currentX = x;
      }

      function closeOthers() {
        document.querySelectorAll(".swipe-content").forEach((el) => {
          if (el !== content) el.style.transform = "translateX(0px)";
        });
      }

      content.addEventListener("pointerdown", (e) => {
        dragging = true;
        startX = e.clientX;
        originX = currentX;
        try { content.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
        closeOthers();
        e.preventDefault();
      });

      content.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const delta = e.clientX - startX;
        const x = Math.min(0, Math.max(-openWidth(), originX + delta));
        setX(x, false);
        e.preventDefault();
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const shouldOpen = currentX < -openWidth() / 2;
        setX(shouldOpen ? -openWidth() : 0, true);
      }

      content.addEventListener("pointerup", endDrag);
      content.addEventListener("pointercancel", endDrag);
      content.addEventListener("dragstart", (e) => e.preventDefault());
    });
  </script>
</body>
</html>
