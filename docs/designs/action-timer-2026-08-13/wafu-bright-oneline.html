<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吉日タイマー — 明色一行燃焼案(和風深化 方向C)</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7edd8;
    --bg-elevated: #fffaf0;
    --ink: #2c1c10;
    --ink-dim: #8a6f52;
    --row-edge: #e3d3ab;
    --flame-1: #ffcf3f;
    --flame-2: #ff7a1a;
    --flame-3: #ff3d1f;
    --char: #2a1f16;
    --danger: #d8360f;
    --ash: #a5906f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    max-width: 480px;
    margin-inline: auto;
    padding-bottom: 32px;
  }

  .header { padding: 26px 20px 16px; border-bottom: 1px solid var(--row-edge); }
  .header h1 {
    font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
    font-size: 1.7rem; letter-spacing: 0.16em; margin: 0; font-weight: 600; color: var(--ink);
  }
  .header p { font-size: 0.78rem; color: var(--ink-dim); margin: 6px 0 0; letter-spacing: 0.03em; }

  .content { padding: 0 20px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .build-version { text-align: center; font-size: 0.7rem; color: var(--ink-dim); opacity: 0.6; padding: 28px 20px 0; }

  /* ラベルは非表示(sr-only)。入力欄と点火ボタンを1行にまとめる */
  .field-row { display: flex; gap: 8px; margin: 20px 0 28px; }
  .field-row input {
    flex: 1; min-width: 0; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--row-edge); background: var(--bg-elevated); color: var(--ink);
    font-size: 1rem; font-family: inherit;
  }
  .field-row input::placeholder { color: var(--ink-dim); }
  .field-row input:focus-visible { outline: 2px solid var(--flame-2); outline-offset: 2px; }

  .btn-ignite {
    flex-shrink: 0; padding: 0 20px; min-height: 48px; border: none; border-radius: 10px;
    background: var(--flame-2);
    color: #2a1200; font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap;
    box-shadow: 0 6px 18px -6px rgba(255,122,26,0.55);
  }
  .btn-ignite:active { transform: scale(0.98); }

  h2.section-title {
    font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
    font-size: 1rem; font-weight: 600; margin: 22px 0 10px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px;
  }
  h2.section-title::before { content: ""; width: 2px; height: 1.1em; background: var(--flame-2); }

  /* ===== 横スライドで編集・削除を出す ===== */
  .swipe-cell {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  /* 幅はボタン分だけ(=144px)。inset:0 にするとセル全幅になり開閉判定がずれるため right 固定で幅を内容に委ねる */
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 0;
    display: flex; align-items: stretch;
  }
  .swipe-btn {
    width: 72px; border: none; font: inherit; font-weight: 700; font-size: 0.82rem;
    color: #fff9ef; cursor: pointer;
  }
  .swipe-edit { background: #8a6f52; }
  .swipe-delete { background: var(--danger); }
  .swipe-content {
    position: relative; z-index: 1;
    touch-action: pan-y;
    transition: transform 0.25s ease;
    background: var(--bg-elevated);
    user-select: none; -webkit-user-select: none;
  }
  .swipe-content.dragging { transition: none; }

  /* ===== 燃焼タスク行: 1行目=ノート+ボタン、2行目=残り時間 ===== */
  .fuse-row {
    position: relative;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 8px 10px 8px 0;
    border-radius: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--row-edge);
  }
  /* 燃えるノート: タイトル部分だけを焦がす。残り時間・ボタンは常に紙面上にあり可読性を保つ */
  .fuse-note {
    --burn: 62%;
    position: relative;
    flex: 1; min-width: 0;
    height: 46px;
    border-radius: 8px;
    overflow: hidden;
    /* 燃えていない側(残り時間)=ポップな配色を地の色として敷く */
    background: linear-gradient(100deg, #ffcf3f, #ff9d3d 55%, #ff7a3d);
  }
  /* 燃え尽きた側(右)を焦がす。--burn(経過割合)が大きいほど右側の黒い領域が左へ広がる */
  .fuse-note::before {
    content: "";
    position: absolute; inset: 0 0 0 calc(100% - var(--burn));
    background: linear-gradient(90deg, var(--char), #17110b 85%);
    clip-path: polygon(100% 0, 4px 0, 0 18%, 5px 34%, 0 50%, 4px 66%, 0 82%, 3px 100%, 100% 100%);
  }
  /* 燃えている最前線(発光)。境界は右端から --burn ぶん進んだ位置 */
  .fuse-note::after {
    content: "";
    position: absolute; top: -4px; bottom: -4px; left: calc(100% - var(--burn)); width: 20px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--flame-2), #fff6b0, var(--flame-1), transparent);
    filter: blur(4px);
  }
  /* タイトルは常に左揃え・左端固定。残量(--burn)が変わっても文字の開始位置は動かさない */
  .fuse-title {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 14px;
    color: #fff9ef;
    text-shadow:
      -1px -1px 1px rgba(0,0,0,.55), 1px -1px 1px rgba(0,0,0,.55),
      -1px 1px 1px rgba(0,0,0,.55), 1px 1px 1px rgba(0,0,0,.55),
      0 2px 5px rgba(0,0,0,.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.98rem; font-weight: 700;
  }

  /* 編集中のインライン入力。タイトル/灰タイトルどちらの文脈でも自然になじむよう継承で揃える */
  .inline-edit-input {
    flex: 1; min-width: 0; width: 100%;
    border: none; border-bottom: 1px dashed currentColor;
    background: transparent; color: inherit; font: inherit; text-shadow: inherit;
    padding: 0; outline: none;
  }

  /* 2行目のキャプション。ボタンの有無や文字数に関わらず note の右端(=焦げの右端)には影響しない */
  .fuse-remaining {
    flex-basis: 100%;
    order: 3;
    padding-left: 14px;
    font-variant-numeric: tabular-nums; font-size: 0.78rem; font-weight: 700;
    color: var(--ink-dim); white-space: nowrap;
  }
  .fuse-row.urgent .fuse-remaining { color: var(--danger); }

  .fuse-action {
    min-height: 36px; padding: 6px 14px; border: 1px solid var(--flame-2); border-radius: 20px;
    background: var(--bg-elevated); color: var(--flame-3); font: inherit; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .fuse-row.urgent .fuse-action { border-color: var(--danger); color: var(--danger); }

  .fuse-row.urgent {
    border-color: var(--danger);
    animation: fuse-pulse 1.8s ease-in-out infinite;
  }
  @keyframes fuse-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(216,54,15,0); }
    50% { box-shadow: 0 0 14px 1px rgba(216,54,15,0.35); }
  }

  /* ===== 不発弾: 一行、灰色で静止(燃焼帯なし) ===== */
  .fuse-row.spent {
    background: #efe4c9;
    border-color: var(--row-edge);
    padding-left: 14px;
  }
  .spent-title {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.98rem; font-weight: 600;
    color: var(--ash);
  }
  .btn-reignite {
    min-height: 34px; padding: 5px 12px; border: 1px solid var(--ash); border-radius: 16px;
    background: transparent; color: var(--ash); font: inherit; font-size: 0.76rem; cursor: pointer;
    flex-shrink: 0;
  }

  /* ===== 今/履歴の画面切り替え(右上アイコン) ===== */
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .icon-btn {
    flex-shrink: 0; width: 40px; height: 40px; margin-top: 2px;
    border: 1px solid var(--row-edge); border-radius: 50%;
    background: var(--bg-elevated); color: var(--ink-dim);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--flame-2); color: var(--flame-3); }
  .view { display: none; }
  .view.active { display: block; }

  .empty-note { color: var(--ink-dim); font-size: 0.85rem; text-align: center; padding: 24px 12px; }

  /* ===== 履歴画面 ===== */
  .history-summary {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin: 4px 0 16px; padding: 14px 16px; border-radius: 10px;
    background: var(--bg-elevated); border: 1px solid var(--row-edge);
  }
  .stat-group { display: flex; gap: 28px; }
  .stat-label { font-size: 0.75rem; color: var(--ink-dim); }
  .stat-value { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .btn-clear-history {
    flex-shrink: 0; min-height: 36px; padding: 6px 14px; border: 1px solid var(--danger); border-radius: 16px;
    background: transparent; color: var(--danger); font: inherit; font-size: 0.78rem; cursor: pointer;
  }
  .history-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px;
    padding: 12px 14px; border-radius: 10px;
    background: var(--bg-elevated); border: 1px solid var(--row-edge); margin-bottom: 8px;
  }
  .history-title {
    flex: 1; min-width: 0; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-meta { flex-basis: 100%; font-size: 0.76rem; color: var(--ink-dim); }

  .history-pagination { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
  .history-pagination .page-btn {
    min-height: 36px; padding: 6px 16px; border: 1px solid var(--row-edge); border-radius: 16px;
    background: var(--bg-elevated); color: var(--ink); font: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer;
  }
  .history-pagination .page-btn:disabled { opacity: 0.4; cursor: default; }
  .history-pagination .page-label { font-size: 0.8rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div>
        <h1>吉日タイマー</h1>
        <p>思い立ったが吉日 — 72時間で導火線は燃え尽きる</p>
      </div>
      <button class="icon-btn" id="history-toggle" aria-label="履歴を見る"></button>
    </div>
  </div>

  <div class="content">
  <div id="view-now" class="view active">
    <div class="field-row">
      <label class="sr-only" for="bright-input">72時間以内に始めること</label>
      <input id="bright-input" type="text" placeholder="思い立ったことを書く" />
      <button class="btn-ignite">点火</button>
    </div>

    <h2 class="section-title">思い立った</h2>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row">
          <div class="fuse-note" style="--burn: 18%">
            <span class="fuse-title">資料のドラフトを書き始める</span>
          </div>
          <span class="fuse-remaining">残り 62時間</span>
          <button class="fuse-action">着手</button>
        </div>
      </div>
    </div>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row">
          <div class="fuse-note" style="--burn: 62%">
            <span class="fuse-title">実家に電話する</span>
          </div>
          <span class="fuse-remaining">残り 27時間14分</span>
          <button class="fuse-action">着手</button>
        </div>
      </div>
    </div>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row urgent">
          <div class="fuse-note" style="--burn: 92%">
            <span class="fuse-title">歯医者に電話する</span>
          </div>
          <span class="fuse-remaining">残り 1時間48分</span>
          <button class="fuse-action">着手</button>
        </div>
      </div>
    </div>

    <h2 class="section-title">燃え尽きた</h2>

    <div class="swipe-cell">
      <div class="swipe-actions">
        <button class="swipe-btn swipe-edit">編集</button>
        <button class="swipe-btn swipe-delete">削除</button>
      </div>
      <div class="swipe-content">
        <div class="fuse-row spent">
          <span class="spent-title">本棚を整理する</span>
          <button class="btn-reignite">再点火</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-history" class="view">
    <div class="history-summary">
      <div class="stat-group">
        <div class="stat">
          <div class="stat-label">平均着手時間</div>
          <div class="stat-value" id="history-average">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">着手率</div>
          <div class="stat-value" id="history-rate">—</div>
        </div>
      </div>
      <button class="btn-clear-history" id="history-clear">履歴をクリア</button>
    </div>
    <div id="history-list"></div>
    <p id="history-empty" class="empty-note">まだ着手した履歴はありません。</p>
    <div id="history-pagination" class="history-pagination"></div>
  </div>
  </div>

  <footer class="build-version">ver.1.0.0</footer>
  <!-- ※ 一行=1タスクの燃焼演出(明色パレット)。汎用デザインシステムへの準拠は意図していない -->
  <script>
    // 横スライドで編集・削除を出す(ポインターイベントでマウス/タッチ両対応)。
    // 再点火で行を動的に追加するため、初期化は関数化していつでも呼べるようにする。
    function initSwipeCell(cell) {
      const content = cell.querySelector(".swipe-content");
      const actions = cell.querySelector(".swipe-actions");
      let startX = 0;
      let originX = 0;
      let currentX = 0;
      let dragging = false;

      function openWidth() {
        return actions.getBoundingClientRect().width;
      }

      function setX(x, animate) {
        content.classList.toggle("dragging", !animate);
        content.style.transform = `translateX(${x}px)`;
        currentX = x;
      }

      function closeOthers() {
        document.querySelectorAll(".swipe-content").forEach((el) => {
          if (el !== content) el.style.transform = "translateX(0px)";
        });
      }

      // 編集ボタンから呼べるように、閉じる処理をセルに持たせておく
      cell.closeSwipe = () => setX(0, true);

      content.addEventListener("pointerdown", (e) => {
        // ボタン上の押下はスワイプ扱いにしない(preventDefaultするとclickが握りつぶされるため)
        if (e.target.closest("button, input, a")) return;
        dragging = true;
        startX = e.clientX;
        originX = currentX;
        try { content.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
        closeOthers();
        e.preventDefault();
      });

      content.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const delta = e.clientX - startX;
        const x = Math.min(0, Math.max(-openWidth(), originX + delta));
        setX(x, false);
        e.preventDefault();
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        const shouldOpen = currentX < -openWidth() / 2;
        setX(shouldOpen ? -openWidth() : 0, true);
      }

      content.addEventListener("pointerup", endDrag);
      content.addEventListener("pointercancel", endDrag);
      content.addEventListener("dragstart", (e) => e.preventDefault());
    }
    document.querySelectorAll(".swipe-cell").forEach(initSwipeCell);

    // 編集: タイトルをその場でテキスト入力に差し替える
    function startEdit(cell) {
      const titleEl = cell.querySelector(".fuse-title, .spent-title");
      if (!titleEl || titleEl.querySelector("input")) return;
      cell.closeSwipe && cell.closeSwipe();

      const original = titleEl.textContent;
      const input = document.createElement("input");
      input.type = "text";
      input.className = "inline-edit-input";
      input.value = original;
      titleEl.textContent = "";
      titleEl.appendChild(input);
      input.focus();
      input.select();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const next = input.value.trim();
        titleEl.textContent = next || original;
      }
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { titleEl.textContent = original; done = true; input.remove(); }
      });
    }

    // 削除: 行そのものをアニメーションしてから取り除く
    function deleteRow(cell) {
      cell.style.transition = "opacity .2s ease, transform .2s ease, margin-bottom .2s ease, max-height .2s ease";
      cell.style.maxHeight = cell.getBoundingClientRect().height + "px";
      requestAnimationFrame(() => {
        cell.style.opacity = "0";
        cell.style.transform = "scale(0.97)";
        cell.style.maxHeight = "0px";
        cell.style.marginBottom = "0px";
      });
      cell.addEventListener("transitionend", () => cell.remove(), { once: true });
    }

    // 燃焼中の行(swipe-cell)を組み立てる。--burn:0% = 点火直後、残り72時間
    function createBurningCell(title) {
      const cell = document.createElement("div");
      cell.className = "swipe-cell";
      cell.innerHTML =
        '<div class="swipe-actions">' +
        '<button class="swipe-btn swipe-edit">編集</button>' +
        '<button class="swipe-btn swipe-delete">削除</button>' +
        "</div>" +
        '<div class="swipe-content">' +
        '<div class="fuse-row">' +
        '<div class="fuse-note" style="--burn: 0%"><span class="fuse-title"></span></div>' +
        '<span class="fuse-remaining">残り 72時間</span>' +
        '<button class="fuse-action">着手</button>' +
        "</div></div>";
      cell.querySelector(".fuse-title").textContent = title;
      return cell;
    }

    // 再点火: 不発弾の行を削除し、同じ文言で「思い立った」に残り72時間で復活させる
    function reignite(cell) {
      const titleEl = cell.querySelector(".spent-title");
      const title = titleEl ? titleEl.textContent : "";
      const unexplodedHeading = Array.from(document.querySelectorAll("h2.section-title"))
        .find((h) => h.textContent === "燃え尽きた");
      const newCell = createBurningCell(title);
      if (unexplodedHeading) {
        unexplodedHeading.parentNode.insertBefore(newCell, unexplodedHeading);
      } else {
        cell.parentNode.insertBefore(newCell, cell);
      }
      initSwipeCell(newCell);
      newCell.style.opacity = "0";
      requestAnimationFrame(() => {
        newCell.style.transition = "opacity .3s ease";
        newCell.style.opacity = "1";
      });
      deleteRow(cell);
      sortBurningList();
      totalRegistered += 1; // 再点火も新規登録として数える
      renderHistory();
    }

    // ===== 履歴 =====
    const history = [];
    // 累計登録数(点火+再点火の合計)。初期表示の思い立った3件+不発弾1件をすでに登録済みとして数える
    let totalRegistered = 4;

    // 「思い立った」を残り時間が少ない順(緊急なもの優先)に並べ替える
    function sortBurningList() {
      const heading = Array.from(document.querySelectorAll("h2.section-title"))
        .find((h) => h.textContent === "思い立った");
      if (!heading) return;
      const cells = [];
      let el = heading.nextElementSibling;
      while (el && el.classList.contains("swipe-cell")) {
        cells.push(el);
        el = el.nextElementSibling;
      }
      const boundary = el; // 「燃え尽きた」見出し。動かさない固定の挿入先アンカー
      cells.sort((a, b) =>
        parseRemainingMinutes(a.querySelector(".fuse-remaining").textContent) -
        parseRemainingMinutes(b.querySelector(".fuse-remaining").textContent)
      );
      cells.forEach((cell) => heading.parentNode.insertBefore(cell, boundary));
    }

    // "残り 27時間14分" のような表記から分数を取り出す
    function parseRemainingMinutes(text) {
      const h = text.match(/(\d+)\s*時間/);
      const m = text.match(/(\d+)\s*分/);
      return (h ? parseInt(h[1], 10) : 0) * 60 + (m ? parseInt(m[1], 10) : 0);
    }
    function formatMinutes(total) {
      const h = Math.floor(total / 60);
      const m = total % 60;
      return m ? `${h}時間${m}分` : `${h}時間`;
    }
    function formatTimestamp(d) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // 着手: 72時間のうちどれだけ経過した時点で着手したかを履歴に積む
    const HISTORY_PAGE_SIZE = 10;
    let historyPage = 1;

    function recordHandled(title, remainingText) {
      const remainingMinutes = parseRemainingMinutes(remainingText);
      const elapsedMinutes = Math.max(0, 72 * 60 - remainingMinutes);
      history.unshift({ title, remainingText, elapsedMinutes, at: new Date() });
      historyPage = 1; // 新しい記録は1ページ目に来るので先頭へ戻す
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      const empty = document.getElementById("history-empty");
      const avgEl = document.getElementById("history-average");
      const rateEl = document.getElementById("history-rate");
      const pagination = document.getElementById("history-pagination");
      list.innerHTML = "";
      pagination.innerHTML = "";

      // 着手率 = 着手件数(履歴) / 累計登録数(点火+再点火の合計)
      rateEl.textContent = totalRegistered > 0
        ? `${history.length}/${totalRegistered}(${Math.round((history.length / totalRegistered) * 100)}%)`
        : "—";

      if (history.length === 0) {
        empty.hidden = false;
        avgEl.textContent = "—";
        return;
      }
      empty.hidden = true;

      const avgMinutes = Math.round(
        history.reduce((sum, h) => sum + h.elapsedMinutes, 0) / history.length
      );
      avgEl.textContent = formatMinutes(avgMinutes);

      // ページング: 件数が増えたら HISTORY_PAGE_SIZE 件ずつに区切る
      const totalPages = Math.max(1, Math.ceil(history.length / HISTORY_PAGE_SIZE));
      historyPage = Math.min(Math.max(1, historyPage), totalPages);
      const start = (historyPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = history.slice(start, start + HISTORY_PAGE_SIZE);

      pageItems.forEach((h) => {
        const row = document.createElement("div");
        row.className = "history-row";
        const title = document.createElement("span");
        title.className = "history-title";
        title.textContent = h.title;
        const meta = document.createElement("span");
        meta.className = "history-meta";
        meta.textContent = `${h.remainingText}で着手・${formatTimestamp(h.at)}`;
        row.appendChild(title);
        row.appendChild(meta);
        list.appendChild(row);
      });

      if (totalPages > 1) {
        const prev = document.createElement("button");
        prev.className = "page-btn";
        prev.textContent = "前へ";
        prev.disabled = historyPage <= 1;
        prev.addEventListener("click", () => { historyPage -= 1; renderHistory(); });

        const label = document.createElement("span");
        label.className = "page-label";
        label.textContent = `${historyPage} / ${totalPages}`;

        const next = document.createElement("button");
        next.className = "page-btn";
        next.textContent = "次へ";
        next.disabled = historyPage >= totalPages;
        next.addEventListener("click", () => { historyPage += 1; renderHistory(); });

        pagination.appendChild(prev);
        pagination.appendChild(label);
        pagination.appendChild(next);
      }
    }

    document.getElementById("history-clear").addEventListener("click", () => {
      history.length = 0;
      historyPage = 1;
      renderHistory();
    });

    // 今/履歴の切り替え(右上アイコン1つで行き来する)
    const ICON_HISTORY =
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
    const ICON_BACK =
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

    const historyToggle = document.getElementById("history-toggle");
    historyToggle.innerHTML = ICON_HISTORY;

    function showView(name) {
      const isHistory = name === "history";
      document.getElementById("view-now").classList.toggle("active", !isHistory);
      document.getElementById("view-history").classList.toggle("active", isHistory);
      historyToggle.innerHTML = isHistory ? ICON_BACK : ICON_HISTORY;
      historyToggle.setAttribute("aria-label", isHistory ? "今に戻る" : "履歴を見る");
    }

    historyToggle.addEventListener("click", () => {
      const isHistory = document.getElementById("view-history").classList.contains("active");
      showView(isHistory ? "now" : "history");
    });

    // クリックはイベント委任にして、再点火・着手で後から増減する行にも自動対応させる
    document.addEventListener("click", (e) => {
      const editBtn = e.target.closest(".swipe-edit");
      if (editBtn) { startEdit(editBtn.closest(".swipe-cell")); return; }

      const deleteBtn = e.target.closest(".swipe-delete");
      if (deleteBtn) { deleteRow(deleteBtn.closest(".swipe-cell")); return; }

      const reigniteBtn = e.target.closest(".btn-reignite");
      if (reigniteBtn) { reignite(reigniteBtn.closest(".swipe-cell")); return; }

      const startBtn = e.target.closest(".fuse-action");
      if (startBtn) {
        const cell = startBtn.closest(".swipe-cell");
        const titleEl = cell.querySelector(".fuse-title");
        const remainingEl = cell.querySelector(".fuse-remaining");
        recordHandled(titleEl ? titleEl.textContent : "", remainingEl ? remainingEl.textContent : "");
        deleteRow(cell);
        return;
      }

      const igniteBtn = e.target.closest(".btn-ignite");
      if (igniteBtn) {
        const input = document.getElementById("bright-input");
        const title = input.value.trim();
        if (!title) { input.focus(); return; }
        const newCell = createBurningCell(title);
        const unexplodedHeading = Array.from(document.querySelectorAll("h2.section-title"))
          .find((h) => h.textContent === "燃え尽きた");
        if (unexplodedHeading) {
          unexplodedHeading.parentNode.insertBefore(newCell, unexplodedHeading);
        } else {
          document.getElementById("view-now").appendChild(newCell);
        }
        initSwipeCell(newCell);
        newCell.style.opacity = "0";
        requestAnimationFrame(() => {
          newCell.style.transition = "opacity .3s ease";
          newCell.style.opacity = "1";
        });
        input.value = "";
        sortBurningList();
        totalRegistered += 1;
        renderHistory();
        return;
      }
    });

    sortBurningList();
    renderHistory();
  </script>
</body>
</html>
