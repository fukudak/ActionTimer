<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吉日タイマー — Fluent 2 案</title>
<style>
  :root {
    color-scheme: light dark;
    --brand: #b6421c;
    --brand-fg-on: #ffffff;
    --bg1: #faf7f4;
    --bg1-rgb: 250, 247, 244;
    --fg1: #1f1a16;
    --fg2: #5c5049;
    --stroke: rgba(31,26,22,0.14);
    --danger: #b3261e;
    --danger-bg: rgba(179,38,30,0.12);
    --warning: #8a5a1f;
    --warning-bg: rgba(138,90,31,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #e08a63;
      --brand-fg-on: #241005;
      --bg1: #1c1815;
      --bg1-rgb: 28, 24, 21;
      --fg1: #f1e9e2;
      --fg2: #bcaea3;
      --stroke: rgba(241,233,226,0.14);
      --danger: #ff8a80;
      --danger-bg: rgba(255,138,128,0.14);
      --warning: #e0b880;
      --warning-bg: rgba(224,184,128,0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", "Hiragino Sans", system-ui, sans-serif;
    /* Mica 近似: 背景色 + 淡いノイズ相当のグラデーションで壁紙越しの質感を模す */
    background:
      radial-gradient(circle at 20% -10%, rgba(182,66,28,0.10), transparent 45%),
      var(--bg1);
    color: var(--fg1);
    max-width: 480px;
    margin-inline: auto;
    padding-bottom: 32px;
  }
  .titlebar {
    padding: 18px 20px 10px;
    border-bottom: 1px solid var(--stroke);
  }
  .titlebar h1 { font-size: 1.3rem; font-weight: 600; margin: 0; }
  .titlebar p { font-size: 0.78rem; color: var(--fg2); margin: 4px 0 0; }

  .content { padding: 0 20px; }

  .field { margin: 16px 0 10px; }
  .field label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--fg2); }
  .field-row { display: flex; gap: 8px; }
  .field input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--stroke);
    background: rgba(var(--bg1-rgb), 0.6);
    color: var(--fg1);
    font-size: 0.95rem;
    font-family: inherit;
  }
  .field input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .btn-primary {
    min-height: 40px;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    background: var(--brand);
    color: var(--brand-fg-on);
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }

  h2.section-title { font-size: 0.95rem; font-weight: 600; margin: 22px 0 10px; color: var(--fg1); }

  .card {
    position: relative;
    border-radius: 8px;
    border: 1px solid var(--stroke);
    /* Acrylic 近似 */
    background: color-mix(in srgb, var(--bg1) 55%, transparent);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    padding: 14px 16px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .card::after {
    /* Reveal: focus-within で縁を光らせる */
    content: "";
    position: absolute; inset: 0;
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px transparent;
    transition: box-shadow 150ms ease-out;
    pointer-events: none;
  }
  .card:focus-within::after { box-shadow: inset 0 0 0 1px var(--brand), 0 0 16px -4px var(--brand); }

  .card-title { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }

  .burn-meter { height: 4px; border-radius: 2px; background: var(--stroke); overflow: hidden; margin-bottom: 8px; }
  .burn-meter > span { display: block; height: 100%; background: var(--brand); }
  .card.urgent .burn-meter > span { background: var(--danger); }

  .card-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: var(--danger-bg); color: var(--danger); }
  .card:not(.urgent) .badge { background: transparent; color: var(--fg2); font-weight: 500; padding-left: 0; }

  .btn-subtle {
    min-height: 36px;
    padding: 6px 14px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--fg1);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-subtle:hover { background: var(--stroke); }

  .card.unexploded {
    background: color-mix(in srgb, var(--bg1) 75%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .card.unexploded .card-row { align-items: flex-start; }
  .unexploded-actions { display: flex; gap: 8px; }
  .btn-outline-danger {
    min-height: 36px;
    padding: 6px 14px;
    border: 1px solid var(--danger);
    border-radius: 6px;
    background: transparent;
    color: var(--danger);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="titlebar">
    <h1>吉日タイマー</h1>
    <p>思い立ったが吉日 — 72時間で導火線は燃え尽きる</p>
  </div>

  <div class="content">
    <div class="field">
      <label for="fl-input">72時間以内に始めること</label>
      <div class="field-row">
        <input id="fl-input" type="text" placeholder="思い立ったことを書く" />
        <button class="btn-primary">点火する</button>
      </div>
    </div>

    <h2 class="section-title">燃えている</h2>

    <div class="card" tabindex="0">
      <p class="card-title">資料のドラフトを書き始める</p>
      <div class="burn-meter"><span style="width:62%"></span></div>
      <div class="card-row">
        <span class="badge">残り 27時間14分</span>
        <button class="btn-subtle">着手した</button>
      </div>
    </div>

    <div class="card urgent" tabindex="0">
      <p class="card-title">歯医者に電話する</p>
      <div class="burn-meter"><span style="width:92%"></span></div>
      <div class="card-row">
        <span class="badge">残り 1時間48分</span>
        <button class="btn-subtle">着手した</button>
      </div>
    </div>

    <h2 class="section-title">不発弾</h2>

    <div class="card unexploded" tabindex="0">
      <div class="card-row">
        <div>
          <span class="badge" style="background:var(--warning-bg); color:var(--warning);">不発弾</span>
          <p class="card-title" style="margin:6px 0 0;">本棚を整理する</p>
        </div>
        <div class="unexploded-actions">
          <button class="btn-subtle">再点火</button>
          <button class="btn-outline-danger">削除</button>
        </div>
      </div>
    </div>
  </div>
  <!-- ※ Web での近似実装(Acrylic/Mica は backdrop-filter で擬似再現)。公式実装は Fluent UI React を参照 -->
</body>
</html>
